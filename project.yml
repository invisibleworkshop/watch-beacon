name: WatchGPSBridge
options:
  bundleIdPrefix: com.invisibleworkshop
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: VHX5NF3JWK
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "18"
    MARKETING_VERSION: "1.0.0"
targets:
  WatchGPSBridge:
    type: application
    platform: iOS
    sources:
      - path: WatchGPSBridge
      - path: Shared
      - path: WatchGPSBridgeLiveActivity/TrackingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invisibleworkshop.watchgpsbridge
        PRODUCT_NAME: WatchGPSBridge
        INFOPLIST_FILE: WatchGPSBridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchGPSBridge/WatchGPSBridge.entitlements
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        # Same scene setup style as 方圓記帳 — SwiftUI WindowGroup owns UI.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: false
        # Only uses Apple OS crypto. Skips TestFlight encryption questionnaire.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - target: WatchGPSBridgeWatch
        embed: true
      - target: WatchGPSBridgeWidgetExtension
        embed: true
    scheme:
      gatherCoverageData: false

  WatchGPSBridgeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WatchGPSBridgeLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invisibleworkshop.watchgpsbridge.WidgetExtension
        PRODUCT_NAME: WatchGPSBridgeWidgetExtension
        INFOPLIST_FILE: WatchGPSBridgeLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  WatchGPSBridgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchGPSBridgeWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invisibleworkshop.watchgpsbridge.watchkitapp
        PRODUCT_NAME: WatchGPSBridgeWatch
        INFOPLIST_FILE: WatchGPSBridgeWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchGPSBridgeWatch/WatchGPSBridgeWatch.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  PreciseGeotagMac:
    type: application
    platform: macOS
    sources:
      - path: PreciseGeotagMac
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invisibleworkshop.watchgpsbridge.geotag
        PRODUCT_NAME: PreciseGeotag
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: PreciseGeotagMac/PreciseGeotagMac.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 精確定位 Geotag
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © invisibleworkshop"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        COMBINE_HIDPI_IMAGES: true
        TARGETED_DEVICE_FAMILY: ""
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: false

schemes:
  WatchGPSBridge:
    build:
      targets:
        WatchGPSBridge: all
        WatchGPSBridgeWatch: all
        WatchGPSBridgeWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
    profileAction:
      config: Release
  PreciseGeotagMac:
    build:
      targets:
        PreciseGeotagMac: all
    run:
      config: Debug
    archive:
      config: Release
    profileAction:
      config: Release
