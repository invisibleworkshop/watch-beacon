name: WatchGPSBridge
options:
  bundleIdPrefix: com.watchgpsbridge
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  WatchGPSBridge:
    type: application
    platform: iOS
    sources:
      - path: WatchGPSBridge
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchgpsbridge.app
        PRODUCT_NAME: WatchGPSBridge
        INFOPLIST_FILE: WatchGPSBridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchGPSBridge/WatchGPSBridge.entitlements
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    dependencies:
      - target: WatchGPSBridgeWatch
        embed: true
    scheme:
      gatherCoverageData: false

  WatchGPSBridgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchGPSBridgeWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchgpsbridge.app.watchkitapp
        PRODUCT_NAME: WatchGPSBridgeWatch
        INFOPLIST_FILE: WatchGPSBridgeWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchGPSBridgeWatch/WatchGPSBridgeWatch.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  WatchGPSBridge:
    build:
      targets:
        WatchGPSBridge: all
        WatchGPSBridgeWatch: all
    run:
      config: Debug
